version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: studyclash-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: studyclash
      MONGO_INITDB_ROOT_PASSWORD: studyclash123
      MONGO_INITDB_DATABASE: StudyClash
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
